name: validate

# Release gate (RR-B-15). Self-contained: inline bash + python3 stdlib only.
# Does NOT execute checked-out repository code.

on:
  push:
  pull_request:

permissions: read-all

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (data only, never executed)
        uses: actions/checkout@v4

      - name: Forbidden content (secrets + leak sentinels)
        run: |
          set -euo pipefail
          patterns='CONFIDENTIAL|BEGIN PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY|BEGIN RSA PRIVATE KEY'
          if grep -rIE "$patterns" . --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::Forbidden content found"; exit 1
          fi
          echo "OK: no leak sentinels"

      - name: Required files present
        run: |
          set -euo pipefail
          required="README.md LICENSE.md COPYRIGHT NOTICE CHANGELOG.md \
                    RELEASE-INFO.txt CITATION.cff .gitignore \
                    docs/index.html docs/.nojekyll probes.json"
          missing=0
          for f in $required; do
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "OK: all required files present"

      - name: Version agreement (single source of truth)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib

          def grab(path, pat):
              m = re.search(pat, pathlib.Path(path).read_text(encoding="utf-8"))
              return m.group(1) if m else None

          versions = {
              "CHANGELOG.md":     grab("CHANGELOG.md", r"##\s*\[(\d+\.\d+\.\d+)\]"),
              "RELEASE-INFO.txt": grab("RELEASE-INFO.txt", r"Version:\s*(\d+\.\d+\.\d+)"),
              "CITATION.cff":     grab("CITATION.cff", r"(?m)^version:\s*(\d+\.\d+\.\d+)"),
          }
          tag = grab("RELEASE-INFO.txt", r"Tag:\s*v(\d+\.\d+\.\d+)")
          versions["RELEASE-INFO.txt Tag"] = tag

          print(versions)
          uniq = set(versions.values())
          if None in uniq:
              print("::error::could not parse a version", file=sys.stderr); sys.exit(1)
          if len(uniq) != 1:
              print(f"::error::version mismatch: {versions}", file=sys.stderr); sys.exit(1)
          print(f"OK: all versions agree on {uniq.pop()}")
          PY

      - name: Landing page is self-contained (no third-party assets)
        run: |
          set -euo pipefail
          # No third-party *assets*: every src must be local (no CDN scripts, fonts,
          # images or trackers). Checked separately from href so that ordinary
          # citation links stay possible.
          if grep -oE 'src="https?://[^"]+"' docs/index.html; then
            echo "::error::landing page loads a remote asset"; exit 1
          fi
          # Navigation links: the repo, its own Pages site, persistent identifiers
          # (doi.org resolver), and canonical licence deeds.
          if grep -oE 'href="https?://[^"]+"' docs/index.html \
               | grep -vE 'github\.com/systems-researcher|systems-researcher\.github\.io|^href="https://doi\.org/|^href="https://creativecommons\.org/licenses/|^href="https://www\.mozilla\.org/en-US/MPL/'; then
            echo "::error::landing page links to an unapproved host"; exit 1
          fi
          echo "OK: landing page self-contained"

      - name: Brandkit page contract (docs/)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib
          from urllib.parse import urlsplit

          # Kit page contract for docs/, re-implemented inline from the sibling
          # kit's tools/check_site.py so the gate never executes checked-out
          # repository code. Drift tripwire only; byte-identity and the wider
          # kit checks stay with the local check_site.py run.
          DOCS = pathlib.Path("docs")
          PAGE = DOCS / "index.html"
          s = PAGE.read_text(encoding="utf-8")
          errors = []

          # 1. No page-level <style> block (kit L109, case-insensitive here:
          # an uppercase <STYLE> is valid HTML and must still fail).
          if re.search(r"<style", s, re.I):
              errors.append("kit contract: page-level <style> block in docs/index.html")

          # 2. No literal colour in style/SVG paint attribute values (kit
          # L36+L38; attribute names matched case-insensitively here).
          COLOUR = re.compile(r"#[0-9a-fA-F]{3,8}\b|\b(?:rgba?|hsla?)\(")
          PAINT = re.compile(r"""\b(?:style|fill|stroke|stop-color|color|flood-color|lighting-color)\s*=\s*(["'])(.*?)\1""", re.S | re.I)
          for _, value in PAINT.findall(s):
              if COLOUR.search(value):
                  errors.append(f"kit contract: literal colour in style/paint attribute of docs/index.html: {value}")

          # 3. First two stylesheet links in document order are the kit pair
          # (kit L88 rel-token harvest + L108 comparison; query and fragment
          # stripped; ./ and root-relative forms both accepted).
          def resolve(path):
              p = (DOCS / path.lstrip("/")) if path.startswith("/") else (PAGE.parent / path)
              return p.resolve()

          ATTR = re.compile(r"""([\w:-]+)\s*=\s*(["'])(.*?)\2""", re.S)
          sheets = []
          for tag in re.findall(r"<link\b[^>]*>", s, re.I):
              a = {k.lower(): v for k, _, v in ATTR.findall(tag)}
              if "stylesheet" in a.get("rel", "").lower().split() and "href" in a:
                  sheets.append(resolve(urlsplit(a["href"]).path))
          want = [(DOCS / "assets/tokens.css").resolve(), (DOCS / "assets/sr-site.css").resolve()]
          if sheets[:2] != want:
              errors.append("kit contract: first two stylesheet links must be assets/tokens.css then assets/sr-site.css")

          # 4. Skip link literal plus its target (kit L107; the literal is
          # order-sensitive by design).
          if 'class="skip" href="#main"' not in s or 'id="main"' not in s:
              errors.append('kit contract: skip link class="skip" href="#main" or id="main" target missing')

          # 5. Exactly one h1 (kit L116, case-insensitive here; an
          # attribute-bearing or uppercase h1 counts).
          h1s = len(re.findall(r"<h1", s, re.I))
          if h1s != 1:
              errors.append(f"kit contract: docs/index.html must contain exactly one h1 (found {h1s})")

          # 6. At most one annotation mark (kit L115).
          annots = s.count('class="annot"')
          if annots > 1:
              errors.append(f'kit contract: at most one class="annot" allowed (found {annots})')

          # 7. The 15 shared kit assets exist (kit SHARED list, 2026-09-28
          # snapshot, og.png excluded). Existence only.
          SHARED = [
              "assets/tokens.css",
              "assets/sr-site.css",
              "assets/sr-zoom.js",
              "assets/sr-emblem.svg",
              "assets/favicon.ico",
              "assets/favicon-32x32.png",
              "assets/apple-touch-icon.png",
              "assets/fonts/eb-garamond-latin-400-italic.woff2",
              "assets/fonts/eb-garamond-latin-400-normal.woff2",
              "assets/fonts/eb-garamond-latin-600-normal.woff2",
              "assets/fonts/ibm-plex-sans-latin-400-italic.woff2",
              "assets/fonts/ibm-plex-sans-latin-400-normal.woff2",
              "assets/fonts/ibm-plex-sans-latin-600-normal.woff2",
              "assets/fonts/OFL-EB-Garamond.txt",
              "assets/fonts/OFL-IBM-Plex-Sans.txt",
          ]
          for rel in SHARED:
              if not (DOCS / rel).is_file():
                  errors.append(f"kit contract: missing shared kit asset docs/{rel}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("OK: docs/ meets the brandkit page contract")
          PY
